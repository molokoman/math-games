<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover" />
  <meta name="color-scheme" content="dark light" />
  <meta name="theme-color" content="#090014" />
  <title>Zap City</title>
  <link rel="icon" href="assets/zip.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/zap.css?v=g1" />
</head>
<body>
  <div id="sky" aria-hidden="true"></div>

  <button id="btn-mute" class="icon-btn" type="button" aria-pressed="false" aria-label="Sound is on. Tap to mute.">
    <svg class="ico-sound ico-on" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="miter" stroke-linecap="square"><rect x="5" y="9" width="5" height="6"/><path d="M10 9 L15 5 V19 L10 15"/><path d="M18 9 L21 12 L18 15"/></svg>
    <svg class="ico-sound ico-off" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="miter" stroke-linecap="square"><rect x="5" y="9" width="5" height="6"/><path d="M10 9 L15 5 V19 L10 15"/><path d="M17 8 L21 16"/><path d="M21 8 L17 16"/></svg>
  </button>

  <section id="screen-start" class="screen active" aria-label="Start">
    <div class="home-hero">
    <h1 class="title">ZAP<em>CITY</em></h1>
    <svg class="intro-laser" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><line class="beam" x1="38" y1="88" x2="50" y2="14" /></svg>
    <div class="intro-city" aria-hidden="true">
      <div class="buildings" id="intro-buildings"></div>
      <div class="ground"></div>
    </div>
    </div>
<button id="btn-start" class="btn primary huge" type="button" aria-label="Defend city"><svg class="ico-shield" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 L20 6.5 V12.2 C20 16.8 16.6 20.2 12 21.5 C7.4 20.2 4 16.8 4 12.2 V6.5 Z" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linejoin="miter"/></svg> Defend city</button>
    <button id="btn-facts" class="btn secondary huge" type="button" aria-label="Mastery">★ Mastery</button>
    <div id="account-bar" class="account-bar">
      <button id="btn-google" class="btn google" type="button" aria-label="Continue with Google">
        <svg class="ico-google" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 8 3.1l5.7-5.7C34.2 6.1 29.4 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.2-.1-2.3-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 16 19 12 24 12c3.1 0 5.8 1.2 8 3.1l5.7-5.7C34.2 6.1 29.4 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 10-2 13.6-5.2l-6.3-5.3C29.2 35.1 26.7 36 24 36c-5.3 0-9.7-3.3-11.3-8l-6.5 5C9.6 39.6 16.3 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-1.1 3.2-3.5 5.8-6.6 7.5l.1.1 6.3 5.3C36.7 41.3 44 36 44 24c0-1.2-.1-2.3-.4-3.5z"/></svg>
        Continue with Google
      </button>
      <div id="account-in" class="account-in" hidden>
        <p id="account-hello" class="account-hello">Hi</p>
        <button id="btn-signout" class="btn ghost tiny" type="button">Sign out</button>
      </div>
      <p id="account-hint" class="account-hint">Play now. Save with Google so your stars follow you.</p>
      <p id="account-status" class="account-status" hidden></p>
    </div>
  </section>

  <section id="screen-picks" class="screen" aria-label="Pick a wave" hidden>
    <h2 class="title small">Choose Your Wave</h2>
    <div class="round-grid" id="round-picks"></div>
    <button type="button" class="btn primary huge btn-nav-back btn-back-bottom" data-back="picks" aria-label="Back">← Back</button>
  </section>

  <section id="screen-game" class="screen" aria-label="Game" hidden>
    <div id="playfield" class="playfield" aria-label="Night sky">
      <div class="moon" aria-hidden="true"></div>
      <svg id="laser-layer" class="laser-layer" aria-hidden="true">
        <line id="laser-beam" class="laser-beam" x1="0" y1="0" x2="0" y2="0" />
      </svg>
      <div id="problems" class="problems"></div>
      <div class="city" id="city" aria-hidden="true">
        <div class="ground"></div>
        <div class="buildings" id="buildings"></div>
      </div>
    </div>
    <div class="dock">
      <div id="pad" class="pad" role="group" aria-label="Number pad"></div>
    </div>
  </section>

  <section id="screen-end" class="screen end-scooch" aria-label="Done" hidden>
    <p id="end-zaps" class="end-zaps" aria-label="Zaps this wave">You zapped <span id="end-zaps-n">0</span><svg class="ico-zap" viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2 L4 14 H11 L9 22 L20 10 H13 Z"/></svg></p>
    <div id="end-mastery" class="end-mastery" role="button" tabindex="0" aria-label="Open mastery">
      <p id="end-key" class="end-key">
        <span class="fact-chip learning">practiced</span>
        <span class="fact-chip mastered">★ mastered</span>
        <span class="fact-chip struggle">needs work</span>
      </p>
      <div id="end-facts" class="fact-row" aria-label="Facts"></div>
    </div>
    <div class="intro-city mini" aria-hidden="true">
      <div class="buildings" id="end-buildings"></div>
      <div class="ground"></div>
    </div>
    <div class="end-actions">
      <button id="btn-again" class="btn primary huge" type="button" aria-label="Play again">↻ Again</button>
      <button id="btn-picks" class="btn secondary huge" type="button" aria-label="Choose wave">Choose wave</button>
    </div>
  </section>

  <section id="screen-facts" class="screen" aria-label="Facts" hidden>
    <div class="page-top"><button type="button" class="btn primary btn-nav-back" data-back="facts" aria-label="Back">← Back</button></div>
    <h2 class="title small">Mastery</h2>
    <p id="facts-key" class="end-key facts-key">
        <span class="fact-chip learning">practiced</span>
        <span class="fact-chip mastered">★ mastered</span>
        <span class="fact-chip struggle">needs work</span>
      </p>
    <div id="facts-bands" class="facts-bands"></div>
    <div class="page-bottom"><button type="button" class="btn primary btn-nav-back" data-back="facts" aria-label="Back">← Back</button></div>
  </section>

  <div id="confetti" aria-hidden="true"></div>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js?v=g1"></script>
  <script src="js/cloud.js?v=g1"></script>
  <script src="js/zap.js?v=g1"></script>
</body>
</html>
