<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover" />
  <meta name="color-scheme" content="dark light" />
  <meta name="theme-color" content="#090014" />
  <title>Zap City</title>
  <link rel="icon" href="assets/zip.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/zap.css?v=kids2" />
</head>
<body>
  <div id="sky" aria-hidden="true"></div>

  <button id="btn-mute" class="icon-btn" type="button" aria-pressed="false" aria-label="Sound is on. Tap to mute.">
    <span class="icon-sound" data-on="🔊" data-off="🔇">🔊</span>
  </button>

  <section id="screen-start" class="screen active" aria-label="Start">
    <h1 class="title">ZAP<em>CITY</em></h1>
    <div class="intro-city" aria-hidden="true">
      <div class="buildings" id="intro-buildings"></div>
      <div class="ground"></div>
    </div>
<button id="btn-start" class="btn primary huge" type="button" aria-label="Play">▶</button>
    <div class="round-grid" id="round-picks"></div>
    <button id="btn-facts" class="btn ghost" type="button" aria-label="My facts">★</button>
    <a href="../" class="text-link" id="link-star-quest" aria-label="Star Quest">✦</a>
  </section>

  <section id="screen-game" class="screen" aria-label="Game" hidden>
    <header class="hud">
      <div class="progress" id="progress" aria-label="Progress"></div>
      <div class="round-chip" id="round-chip">+ 10</div>
    </header>
    <p id="sky-problem" class="sky-problem" aria-live="polite">3 + 4</p>
    <div id="playfield" class="playfield" aria-label="Night sky">
      <div class="moon" aria-hidden="true"></div>
      <svg id="laser-layer" class="laser-layer" aria-hidden="true">
        <line id="laser-beam" class="laser-beam" x1="0" y1="0" x2="0" y2="0" />
      </svg>
      <div id="problems" class="problems"></div>
      <div class="city" id="city" aria-hidden="true">
        <div class="ground"></div>
        <div class="buildings" id="buildings"></div>
      </div>
    </div>
    <div class="dock">
      <div id="typed" class="typed" aria-live="polite" aria-label="Your answer">?</div>
      <div id="pad" class="pad" role="group" aria-label="Number pad"></div>
    </div>
  </section>

  <section id="screen-end" class="screen" aria-label="Done" hidden>
    <div class="intro-city mini" aria-hidden="true">
      <div class="buildings" id="end-buildings"></div>
      <div class="ground"></div>
    </div>
    <p id="end-zaps" class="end-zaps">⚡</p>
    <div class="end-actions">
      <button id="btn-again" class="btn primary huge" type="button" aria-label="Play again">↻</button>
      <button id="btn-next" class="btn secondary huge" type="button" aria-label="Next">▶</button>
      <p id="end-ready" class="ready-banner" hidden></p>
      <div id="end-facts" class="fact-row" aria-label="Facts"></div>
      <button id="btn-facts-end" class="btn ghost" type="button" aria-label="My facts">★</button>
      <button id="btn-picks" class="btn ghost" type="button" aria-label="Pick a wave">+ −</button>
      <a href="../" class="text-link" id="link-star-quest-end" aria-label="Star Quest">✦</a>
    </div>
  </section>

  <section id="screen-facts" class="screen" aria-label="Facts" hidden>
    <h2 class="title small">★</h2>
    <p id="facts-ready" class="ready-banner" hidden></p>
    <div id="facts-bands" class="facts-bands"></div>
    <button id="btn-facts-back" class="btn primary huge" type="button" aria-label="Back">←</button>
  </section>

  <div id="confetti" aria-hidden="true"></div>
  <script src="js/zap.js?v=kids2"></script>
</body>
</html>
